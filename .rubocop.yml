plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"

Layout/LineLength:
  Max: 120
  Exclude:
    - "spec/**/*"

Metrics:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

# Matches the main Edify app, which dropped these comments (edifyapporg/edify e9e3ea9).
Style/FrozenStringLiteralComment:
  Enabled: false

# Matches the main Edify app. Methods like Config#delete return whether they did something without being questions.
Naming/PredicateMethod:
  Enabled: false
